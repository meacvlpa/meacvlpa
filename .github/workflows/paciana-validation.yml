name: PACIANA validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check api/chat.js
          node --check app.js
          node --check tests/run-semantic-eval.js
      - name: Validate semantic benchmark fixture
        run: node tests/run-semantic-eval.js --check
